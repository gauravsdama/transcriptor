name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: true
      - run: uv sync --locked --extra diarization --extra setup
      - run: uvx ruff==0.17.0 check transcriptor scripts tests
      - run: uv run python -m unittest discover -s tests -v
      - run: uvx bandit==1.9.4 -q -r transcriptor scripts
      - name: Audit installed dependencies
        run: |
          site_packages=$(uv run python -c 'import site; print(site.getsitepackages()[0])')
          uvx pip-audit==2.10.1 --path "$site_packages"
      - run: uv build
