[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "transcriptor"
version = "0.1.0"
description = "Local inbox-to-transcript pipeline for personal voice memos."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
requires-python = ">=3.12"
dependencies = [
  "faster-whisper>=1.2.1",
]

[project.optional-dependencies]
diarization = [
  "pyannote.audio>=4.0.7,<5",
]
setup = [
  "keyring>=25,<26",
]

[project.scripts]
transcriptor-inbox = "transcriptor.cli:main"
transcriptor-speakers = "transcriptor.speakers:main"
transcriptor-setup = "transcriptor.model_setup:main"

[tool.setuptools.packages.find]
include = ["transcriptor*"]
